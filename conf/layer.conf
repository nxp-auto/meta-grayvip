# We have a conf and classes directory, add to BBPATH.
BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS:append = " grayvip"
BBFILE_PATTERN_grayvip = "^${LAYERDIR}/"
BBFILE_PRIORITY_grayvip = "13"

# The dynamic-layers directory hosts the extensions and layer specific
# modifications related to NXP products.
#
# The .bbappend and .bb files are included if the respective layer
# collection is available.
BBFILES += "${@' '.join('${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bbappend' % layer \
                for layer in BBFILE_COLLECTIONS.split())}"
BBFILES += "${@' '.join('${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bb' % layer \
                for layer in BBFILE_COLLECTIONS.split())}"

# We have recipes-* directories, add to BBFILES.
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    ${LAYERDIR}/classes/*.bb* \
"

LAYERSERIES_COMPAT_grayvip = "scarthgap"

# ALB_RELEASE is derived from RELEASE_BASE token-by-token. Check the DISTRO_VERSION
# assignment done in meta-alb/meta-alb-sdk/conf/distro/fsl-auto.conf.
ALB_RELEASE = "${@ ' '.join( \
        t[3:] if t.startswith('bsp') \
        else t.upper() if (t.startswith('s32') and len(t) > 3 and t[3].isalpha()) \
        else t \
        for t in (d.getVar('RELEASE_BASE') or '').replace('release/', '', 1).split('_') \
    ) or 'unknown' }"
GRAYVIP_RELEASE = "1.0.6.3"
